<title>Agency Simulator</title>
<style>
:root{--bg:#F5F1E8;--card:#FFFFFF;--line:#DDD5C3;--tx:#14213D;--mu:#4F5B75;--ac:#FCA311;--act:#8A5200;--bar:#E8E1D0;--bad:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14213D;--card:#1E2F55;--line:#2C4070;--tx:#F5F1E8;--mu:#B8C0D0;--act:#FCA311;--bar:#14213D;--bad:#FF9A8F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14213D;--card:#1E2F55;--line:#2C4070;--tx:#F5F1E8;--mu:#B8C0D0;--act:#FCA311;--bar:#14213D;--bad:#FF9A8F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:30px}h2{margin:0;font-size:18px}
.lb{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--act)}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat b{display:block;font-size:18px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;background:var(--ac);color:#14213D;font-weight:700;font-size:16px;min-height:48px;padding:0 16px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:14px;min-height:44px}
.btn.alt,.btn[aria-pressed="false"]{background:transparent;color:var(--tx);border:1px solid var(--line)}
.st{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:56px;margin-top:8px}
.st[aria-pressed="true"]{border-color:var(--ac)}
.st:disabled{opacity:.5;cursor:not-allowed}
.inp{width:100%;box-sizing:border-box;margin-top:8px;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.need{font-weight:700;color:var(--act)}
.bar{height:6px;border-radius:3px;background:var(--bar);margin-top:6px}.bar i{display:block;height:6px;border-radius:3px;background:var(--ac)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;margin:2px 4px 0 0}
.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.bad{color:var(--bad);font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;min-height:56px;border:0;background:none;font-weight:600;font-size:14px;color:var(--mu)}
.tabs button[aria-current="true"]{color:var(--act);box-shadow:inset 0 3px 0 var(--ac)}
</style>
</head>

<script>
let TAB='studio',LANG='id',G=null,V='main',MSG='',NAME='Studio Senja',uid=10;
const J=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
try{LANG=localStorage.getItem('as-lang')==='en'?'en':'id'}catch(e){}
const T=(i,e)=>LANG=='en'?e:i;
const sn=k=>({k:T('Kreativitas','Creativity'),s:T('Strategi','Strategy'),c:T('Klien','Client')})[k];

{n:['Samudra Motor','Samudra Motor'],d:['Kampanye peluncuran mobil listrik nasional.','Launch campaign for a national electric car.'],t:['Standar tinggi, budget besar','High standards, big budget'],k:['k','s'],v:.1,m:2,r:100},
{n:['Aurora Tech','Aurora Tech'],d:['Kampanye global peluncuran produk teknologi.','Global launch campaign for a tech product.'],t:['Menuntut konsep kelas dunia','Demands world-class concepts'],k:['s','c'],v:.1,m:3,r:180},
{n:['Komite Olahraga Dunia','World Sports Committee'],d:['Identitas dan kampanye untuk pesta olahraga dunia.','Identity and campaign for a world sports festival.'],t:['Sorotan dunia, tekanan tinggi','Global spotlight, high pressure'],k:['k','s'],v:.14,m:4,r:250}];

const CT=[{n:['Bandung','Bandung'],r:25,cost:25,inc:3,rp:.3},{n:['Surabaya','Surabaya'],r:40,cost:40,inc:4,rp:.4},{n:['Bali','Bali'],r:60,cost:60,inc:6,rp:.5},{n:['Medan','Medan'],r:75,cost:60,inc:6,rp:.5},{n:['Singapura','Singapore'],r:100,cost:120,inc:14,rp:.8},{n:['Tokyo','Tokyo'],r:150,cost:200,inc:22,rp:1},{n:['London','London'],r:200,cost:300,inc:30,rp:1.2},{n:['New York','New York'],r:250,cost:450,inc:42,rp:1.5}];
const upc=b=>Math.round(CT[b.c].cost*(b.lv==1?.8:1.2));
const cap=()=>6+G.br.reduce((a,b)=>a+b.lv*2,0);
function netCard(nm,perm){return '<div class="card"><h2>'+T('Jaringan agensi','Agency network')+'</h2><p class="mu" style="margin:4px 0 0">'+T('Induk: ','Parent: ')+'<b>'+nm+'</b> · '+T('Karyawan tetap ','Permanent staff ')+perm+' / '+cap()+'. '+T('Target menang: reputasi 300 dan minimal 4 cabang.','To win: 300 reputation and at least 4 branches.')+'</p>'+G.br.map((b,i)=>{const c=CT[b.c];return '<div style="margin-top:12px"><b>'+nm+' '+T(...c.n)+'</b> <span class="chip">Lv '+b.lv+'</span><br><span class="mu">'+T('Pendapatan sekitar ','Income about ')+rpf(c.inc*b.lv)+T(' per proyek, reputasi +',' per project, reputation +')+(c.rp*b.lv).toFixed(1)+'</span>'+(b.lv<3?'<br><button class="btn sm alt" style="margin-top:6px" data-a="up" data-i="'+i+'"'+(G.kas<upc(b)?' disabled':'')+'>'+T('Naik level ','Upgrade ')+rpf(upc(b))+'</button>':'')+'</div>'}).join('')+'<h2 style="margin-top:16px;font-size:16px">'+T('Buka cabang baru','Open a new branch')+'</h2>'+CT.map((c,i)=>{if(G.br.some(b=>b.c==i))return '';const lock=G.rep<c.r;return '<div class="li" style="align-items:center;gap:10px"><span><b>'+T(...c.n)+'</b><br><span class="mu">'+(lock?T('Butuh reputasi ','Needs reputation ')+c.r:T('Pendapatan ','Income ')+rpf(c.inc)+T(' per proyek',' per project'))+'</span></span><button class="btn sm" style="width:auto;flex:0 0 auto" data-a="open" data-i="'+i+'"'+(lock||G.kas<c.cost?' disabled':'')+'>'+rpf(c.cost)+'</button></div>'}).join('')+'</div>'}
const QT=[['Klien kecewa dan minta revisi besar.','The client is disappointed and wants major revisions.'],['Hasilnya kurang sesuai harapan.','The result fell short of expectations.'],['Klien cukup puas.','The client is fairly satisfied.'],['Klien puas dan bilang akan balik lagi.','The client is happy and will come back.'],['Klien terpukau dan merekomendasikan kalian!','The client is amazed and recommends you!']];
function cand(){const m=['k','s','c'][rnd(0,2)],sk={k:rnd(30,45),s:rnd(30,45),c:rnd(30,45)};sk[m]=rnd(62,78);return{id:++uid,name:PN[rnd(0,9)],ri:rnd(4,8),sk,lelah:0}}
function regBrief(){const ok=CL.filter(c=>c.r<=G.rep).slice(-4),c=ok[rnd(0,ok.length-1)],need={};c.k.forEach(k=>need[k]=Math.min(96,Math.round((40+G.rep*.45+rnd(-5,8))*D[G.lv].nd)));const avg=c.k.reduce((a,k)=>a+need[k],0)/c.k.length;return{c,need,budget:Math.round((8+avg*.35)*c.m)}}
function pitchBrief(){const t=TD[rnd(0,2)],need={};['k','s','c'].forEach(k=>need[k]=Math.min(96,Math.round((55+G.rep*.5+rnd(-4,6))*D[G.lv].nd)));const avg=(need.k+need.s+need.c)/3,R=RV.slice().sort(()=>Math.random()-.5).slice(0,2).map(n=>({n,p:+(.85+D[G.lv].rv+Math.min(.2,G.rep/250)+Math.random()*.3).toFixed(2)}));return{c:{n:t.n,d:t.d,t:['Penilaian ketat, hanya satu pemenang','Strict judging, only one winner'],k:['k','s','c'],v:.1,m:2.2},need,budget:Math.round((8+avg*.35)*2.2*(1+ti(G.rep)*.5)),pitch:true,rivals:R}}
function newBrief(np){return!np&&G.no>=3&&G.no%3==0?pitchBrief():regBrief()}
function init(L,name){G={name,lv:L,no:1,kas:D[L].k,rep:10,staff:[
{id:1,name:'Raka',ri:0,sk:{k:80,s:40,c:30},lelah:0},{id:2,name:'Sinta',ri:1,sk:{k:40,s:75,c:50},lelah:0},
{id:3,name:'Dimas',ri:2,sk:{k:60,s:45,c:40},lelah:0},{id:4,name:'Wulan',ri:3,sk:{k:30,s:45,c:70},lelah:0}],cands:[cand(),cand()],br:[],brief:null,sel:[],res:null,over:null};G.brief=newBrief();save()}
function save(){if(G)W('as-auto',G)}
const N=()=>G.brief.pitch?3:2;
const EX=()=>Math.min(96,Math.round((45+G.rep*.5)*D[G.lv].nd));
function gap(){const x=EX();return Object.keys({k:1,s:1,c:1}).map(k=>{const m=Math.max(...G.staff.map(s=>s.sk[k]));return{k,m,st:m>=x+10?0:m>=x?1:2}})}
function ass(s){const x=EX(),best=Math.max(s.sk.k,s.sk.s,s.sk.c);if(s.cuti)return[T('Sedang cuti, kembali setelah proyek ini','On leave, returns after this project'),0];if(s.lelah>=60)return[T('Kelelahan, istirahatkan dulu','Exhausted, rest them first'),0];if(s.fl)return[T('Freelance, hilang setelah proyek','Freelancer, leaves after the project'),0];const top=['k','s','c'].filter(k=>s.sk[k]==Math.max(...G.staff.map(t=>t.sk[k])));if(top.length)return[T('Andalan di ','Top performer in ')+top.map(sn).join(', '),0];if(best<x)return[T('Skill di bawah tuntutan klien, pertimbangkan diganti','Skills below client demands, consider replacing'),1];return[T('Cadangan solid','Solid backup'),0]}
function cl(c,gp,ex){const L=[],best=Math.max(c.sk.k,c.sk.s,c.sk.c);gp.forEach(g=>{if(c.sk[g.k]>g.m)L.push([g.st==2?T('Menutup kelemahan di ','Covers a weakness in ')+sn(g.k):T('Lebih kuat dari tim di ','Stronger than your team in ')+sn(g.k)+' ('+g.m+T(' jadi ',' to ')+c.sk[g.k]+')',0])});L.push([best>=ex?T('Layak jadi karyawan tetap','Worth hiring permanently'):T('Di bawah tuntutan klien, lebih cocok freelance','Below client demands, better as a freelancer'),best<ex]);return L.map(l=>'<span class="'+(l[1]?'bad':'need')+'" style="display:block;font-size:13px;margin-top:2px">'+l[0]+'</span>').join('')}
function fit(){const b=G.brief,t=G.staff.filter(s=>G.sel.includes(s.id));if(t.length<N())return 0;let tot=0;b.c.k.forEach(k=>{const v=t.map(s=>s.sk[k]).sort((a,b)=>b-a);tot+=Math.min(1.3,(v[0]+.3*v[1]+.15*(v[2]||0))/b.need[k])});let r=tot/b.c.k.length;const f=t.reduce((a,s)=>a+s.lelah,0)/t.length;if(f>60)r*=1-(f-60)/200;return r}
function evx(){if(Math.random()>.4)return null;const s=G.staff[rnd(0,G.staff.length-1)],i=rnd(0,4),k=['k','s','c'][rnd(0,2)];if(i==0)G.kas+=3;if(i==1)s.lelah=Math.min(100,s.lelah+25);if(i==2)s.sk[k]=Math.min(99,s.sk[k]+2);if(i==3)G.kas-=2;if(i==4)G.rep=Math.min(300,G.rep+3);return{i,n:s.name,k}}
const evt=e=>[T('Klien lama kirim bonus Rp 3 jt.','An old client sent a IDR 3M bonus.'),T(e.n+' kena flu, kelelahan naik.',e.n+' caught the flu, fatigue went up.'),T(e.n+' ikut workshop gratis: '+sn(e.k)+' +2.',e.n+' joined a free workshop: '+sn(e.k)+' +2.'),T('Laptop studio rusak, servis Rp 2 jt.','A studio laptop broke, repair cost IDR 2M.'),T('Hasil kerja kalian viral di media sosial: reputasi +3.','Your work went viral on social media: reputation +3.')][e.i];
function work(){const b=G.brief,t=G.staff.filter(s=>G.sel.includes(s.id));
const r=fit()*(1+(Math.random()*2-1)*b.c.v*D[G.lv].vr),st=r>=1.15?5:r>=1?4:r>=.8?3:r>=.6?2:1,up=[];
let pay=Math.round(b.budget*[.3,.55,.8,1,1.15][st-1]),rp=[-6,-2,2,5,8][st-1],win=null,rv=null;
if(b.pitch){const best=b.rivals.reduce((m,x)=>x.p>m.p?x:m);rv=best.n;win=r>best.p;pay=win?b.budget:0;rp=win?12:-3}
t.forEach(s=>b.c.k.forEach(k=>{const g=s.sk[k]<b.need[k]?2:1;s.sk[k]=Math.min(99,s.sk[k]+g);up.push([s.name,k,g,0])}));
if(win)t.forEach(s=>{const k=b.c.k[rnd(0,2)];s.sk[k]=Math.min(99,s.sk[k]+3);up.push([s.name,k,3,1])});
G.staff.forEach(s=>{s.lelah=G.sel.includes(s.id)?Math.min(100,s.lelah+25):Math.max(0,s.lelah-15);s.cuti=false});
G.staff=G.staff.filter(s=>!s.fl);
const gaji=G.staff.length*D[G.lv].g+(b.pitch?3:0);let bi=0,br=0;G.br.forEach(x=>{const c=CT[x.c];bi+=Math.round(c.inc*x.lv*(.8+Math.random()*.4));br+=c.rp*x.lv});G.kas+=pay-gaji+bi;G.rep=Math.max(0,Math.min(300,G.rep+rp+br));
G.res={st,pay,gaji,rp,bi,br,up,c:b.c.n,win,rv,pitch:!!b.pitch,ev:evx()};G.no++;G.sel=[];G.brief=newBrief();G.cands=[cand(),cand()];
G.over=G.kas<0?'lose':G.rep>=300&&G.br.length>=4?'win':null;save();draw();window.scrollTo(0,0)}
function hire(i,fl){const c=G.cands[i],cost=fl?4:12;if(G.kas<cost||(!fl&&G.staff.filter(s=>!s.fl).length>=cap()))return;G.kas-=cost;G.cands.splice(i,1);c.fl=fl;G.staff.push(c);save();draw()}

let h=hd()+'<h1>'+nm+'</h1><div class="mu">'+T('Level agensi','Agency level')+': <b>'+TR(G.rep)+'</b> · '+T('Mode ','Mode ')+T(...D[G.lv].n)+'</div><div class="mu">'+T('Peringkat Indonesia #','Indonesia rank #')+rk(G.rep)[0]+' · '+T('Dunia #','World #')+rk(G.rep)[1]+(G.br.length?' · '+G.br.length+T(' cabang',' branches'):'')+'</div><div class="row"><div class="card stat"><span class="mu">'+T('Kas','Cash')+'</span><b>'+rpf(G.kas)+'</b></div><div class="card stat"><span class="mu">'+T('Reputasi','Reputation')+'</span><b>'+Math.floor(G.rep)+'</b></div><div class="card stat"><span class="mu">'+T('Proyek','Project')+'</span><b>#'+G.no+'</b></div></div>';
if(G.res){const r=G.res;return h+'<div class="card"><div class="lb">'+(r.pitch?T('HASIL TENDER','TENDER RESULT'):T('HASIL PROYEK','PROJECT RESULT'))+'</div><h2>'+T(...r.c)+'</h2>'+(r.pitch?'<p><b>'+(r.win?T('Menang tender! Presentasi kalian mengalahkan saingan.','Tender won! Your pitch beat the rivals.'):T('Kalah dari '+r.rv+'. Tender dimenangkan agensi lain.','Lost to '+r.rv+'. Another agency won the tender.'))+'</b></p>':'<div role="img" aria-label="'+r.st+' / 5" style="margin:8px 0">'+[1,2,3,4,5].map(i=>star(i<=r.st)).join('')+'</div><p class="mu">'+T(...QT[r.st-1])+'</p>')+'<div class="li"><span class="mu">'+T('Pembayaran','Payment')+'</span><b>+ '+rpf(r.pay)+'</b></div>'+(r.bi?'<div class="li"><span class="mu">'+T('Pendapatan cabang','Branch income')+'</span><b>+ '+rpf(r.bi)+'</b></div>':'')+'<div class="li"><span class="mu">'+T('Gaji dan biaya','Salaries and costs')+'</span><b>- '+rpf(r.gaji)+'</b></div><div class="li"><span class="mu">'+T('Reputasi','Reputation')+'</span><b>'+((r.rp+(r.br||0))>=0?'+ ':'- ')+Math.abs(Math.round((r.rp+(r.br||0))*10)/10)+'</b></div><p class="mu">'+r.up.map(u=>u[0]+' · '+sn(u[1])+' +'+u[2]+(u[3]?T(' (bonus tender)',' (tender bonus)'):'')).join(' · ')+'</p>'+(r.ev?'<p><span class="lb">'+T('KABAR STUDIO','STUDIO NEWS')+'</span><br>'+evt(r.ev)+'</p>':'')+'<button class="btn" data-a="next">'+T('Lanjut','Continue')+'</button></div>'+ft()}
hs+='<div class="card"><div class="lb">'+(b.pitch?'TENDER · PITCHING':T('BRIEF MASUK','INCOMING BRIEF'))+'</div><h2>'+T(...b.c.n)+'</h2><p class="mu" style="margin:4px 0 8px">'+T(...b.c.d)+'</p><span class="chip">'+T(...b.c.t)+'</span>'+b.c.k.map(k=>'<span class="chip need">'+sn(k)+' '+b.need[k]+'</span>').join('')+'<span class="chip">Budget '+rpf(b.budget)+'</span>'+(b.pitch?'<p class="mu" style="margin:10px 0 0">'+T('Saingan: ','Rivals: ')+b.rivals.map(x=>x.n+' ('+(x.p<.95?T('sedang','moderate'):x.p<1.1?T('kuat','strong'):T('sangat kuat','very strong'))+')').join(', ')+'. '+T('Menang: bayaran penuh, reputasi +12, bonus skill. Kalah: rugi biaya presentasi Rp 3 jt. Butuh tim 3 orang.','Win: full payment, reputation +12, skill bonus. Lose: you lose the IDR 3M pitch cost. Needs a 3-person team.')+'</p>':'')+'<button class="btn sm alt" data-a="skip" style="margin-top:10px">'+T('Lewati brief (reputasi -1)','Skip brief (reputation -1)')+'</button></div>';
const f=Math.round(fit()*100),ok=G.sel.length==N();
hs+='<div class="card"><h2>'+T('Pilih tim ('+N()+' orang)','Pick your team ('+N()+' people)')+'</h2>'+G.staff.map(s=>'<button class="st" data-a="pick" data-id="'+s.id+'" aria-pressed="'+G.sel.includes(s.id)+'"'+(s.cuti?' disabled':'')+'><span><b>'+esc(s.name)+'</b>'+(s.fl?' <span class="chip">Freelance</span>':'')+'<br><span class="mu">'+T(...PR[s.ri])+'</span><br><span class="mu">'+sk(s,b.need)+'</span></span><span class="mu" style="text-align:right">'+T('Lelah ','Fatigue ')+s.lelah+'%<div class="bar" style="width:70px"><i style="width:'+s.lelah+'%"></i></div></span></button>').join('')+'<p class="mu">'+T('Kecocokan tim: ','Team fit: ')+'<b>'+(ok?f+'%':'-')+'</b>'+(ok&&G.staff.filter(s=>G.sel.includes(s.id)).reduce((x,s)=>x+s.lelah,0)/N()>60?' <span class="bad">'+T('Tim kelelahan, performa turun','Team exhausted, performance drops')+'</span>':'')+'</p><button class="btn" data-a="work"'+(ok?'':' disabled')+'>'+T('Mulai Kerjakan','Start Work')+'</button></div>';
const ex=EX(),gp=gap(),stn=[T('Aman','Safe'),T('Pas-pasan','Borderline'),T('Tertinggal','Behind')],weak=gp.filter(g=>g.st==2),perm=G.staff.filter(z=>!z.fl).length;
ht+='<div class="card"><h2>'+T('Evaluasi tim','Team review')+'</h2><p class="mu" style="margin:4px 0 0">'+T('Tuntutan klien di level agensi kamu sekarang sekitar <b>'+ex+'</b> per skill.','Client demands at your agency level are about <b>'+ex+'</b> per skill.')+'</p>'+gp.map(g=>'<div class="li"><span class="mu">'+T(sn(g.k)+' terbaik: '+g.m,'Best '+sn(g.k)+': '+g.m)+'</span><b class="'+(g.st==2?'bad':'')+'">'+stn[g.st]+'</b></div>').join('')+(weak.length?'<p class="bad">'+T('Rekrut orang yang kuat di ','Recruit someone strong in ')+weak.map(g=>sn(g.k)).join(T(' dan ',' and '))+'.</p>':'<p class="mu">'+T('Semua skill masih aman. Fokus jaga kelelahan tim.','All skills are safe. Focus on keeping the team rested.')+'</p>')+G.staff.map(s=>{const q=ass(s);return'<div style="margin-top:10px"><b>'+esc(s.name)+'</b><br><span class="'+(q[1]?'bad':'mu')+'">'+q[0]+'</span>'+(!s.fl&&s.lelah>=30&&!s.cuti?'<br><button class="btn sm alt" style="margin-top:6px" data-a="cuti" data-id="'+s.id+'"'+(G.kas<2?' disabled':'')+'>'+T('Beri cuti (Rp 2 jt, lelah -40, absen 1 proyek)','Give leave (IDR 2M, fatigue -40, out for 1 project)')+'</button>':'')+(!s.fl&&perm>3?'<br><button class="btn sm alt" style="margin-top:6px" data-a="fire" data-id="'+s.id+'"'+(G.kas<3?' disabled':'')+'>'+T('Berhentikan (pesangon Rp 3 jt)','Dismiss (IDR 3M severance)')+'</button>':'')+'</div>'}).join('')+'</div>';
ht+='<div class="card"><h2>'+T('Rekrut','Recruit')+'</h2><p class="mu" style="margin:4px 0 0">'+T('Freelance bayar sekali untuk satu proyek. Karyawan tetap mahal dan digaji tiap proyek (Rp '+D[G.lv].g+' jt per orang), tapi skill-nya terus naik.','Freelancers are paid once for one project. Permanent staff cost more and are paid every project (IDR '+D[G.lv].g+'M each), but their skills keep growing.')+'</p>'+G.cands.map((c,i)=>'<div style="margin-top:12px"><b>'+c.name+'</b> <span class="mu">'+T(...PR[c.ri])+'</span><br><span class="mu">'+sk(c)+'</span>'+cl(c,gp,ex)+'<div class="row" style="margin-top:8px"><button class="btn sm alt" data-a="fl" data-i="'+i+'"'+(G.kas<4?' disabled':'')+'>Freelance '+rpf(4)+'</button><button class="btn sm" data-a="perm" data-i="'+i+'"'+(G.kas<12||perm>=cap()?' disabled':'')+'>'+T('Tetap ','Permanent ')+rpf(12)+'</button></div></div>').join('')+'</div>';
return h+tabs(hs,ht,netCard(nm,perm))}
function draw(){const a=document.getElementById('app');if(V=='game'&&!G)V='main';document.documentElement.lang=LANG;a.innerHTML=V=='main'?vMain():V=='new'?vNew():V=='save'||V=='load'?vSlots(V):vGame()}
document.getElementById('app').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
if(a=='lang'){LANG=t.dataset.l;try{localStorage.setItem('as-lang',LANG)}catch(x){}draw();return}
if(a=='new'){V='new'}
else if(a=='menu'){V='main'}
else if(a=='back'){V='game'}
else if(a=='tab'){TAB=t.dataset.t}
else if(a=='cont'){const A=J('as-auto');if(A&&A.staff){G=A;G.br=G.br||[];V='game'}}
else if(a=='loadv'){V='load';MSG=''}
else if(a=='savev'){V='save';MSG=''}
else if(a=='start'){const v=((document.getElementById('nm')||{}).value||'').trim().slice(0,24);NAME=v||'Studio Senja';init(i,NAME);TAB='studio';V='game'}
else if(a=='sv'&&G){const s=slots();s[i]={at:Date.now(),d:JSON.parse(JSON.stringify(G))};MSG=W('as-slots',s)?T('Game tersimpan di Slot '+(i+1)+'.','Game saved to Slot '+(i+1)+'.'):T('Gagal menyimpan: penyimpanan browser tidak tersedia.','Could not save: browser storage is unavailable.')}
else if(a=='ld'){const x=slots()[i];if(x&&x.d&&x.d.staff){G=JSON.parse(JSON.stringify(x.d));G.br=G.br||[];V='game';save()}}
else if(a=='pick'){const id=+t.dataset.id;if(G.sel.includes(id))G.sel=G.sel.filter(x=>x!=id);else{G.sel.push(id);if(G.sel.length>N())G.sel.shift()}}
else if(a=='work'){if(G.sel.length==N())work();return}
else if(a=='next'){G.res=null;TAB='studio';save()}
else if(a=='skip'){G.rep=Math.max(0,G.rep-1);G.sel=[];G.brief=newBrief(true);save()}
else if(a=='fl'){hire(i,true);return}
else if(a=='perm'){hire(i,false);return}
else if(a=='cuti'){const s=G.staff.find(z=>z.id==+t.dataset.id);if(s&&G.kas>=2&&!s.cuti){G.kas-=2;s.lelah=Math.max(0,s.lelah-40);s.cuti=true;G.sel=G.sel.filter(x=>x!=s.id);save()}}
else if(a=='open'){const c=CT[i];if(c&&G.rep>=c.r&&G.kas>=c.cost&&!G.br.some(b=>b.c==i)){G.kas-=c.cost;G.br.push({c:i,lv:1});save()}}
else if(a=='up'){const b=G.br[i];if(b&&b.lv<3&&G.kas>=upc(b)){G.kas-=upc(b);b.lv++;save()}}
else if(a=='fire'){if(G.kas>=3&&G.staff.filter(s=>!s.fl).length>3){const id=+t.dataset.id;G.kas-=3;G.staff=G.staff.filter(s=>s.id!=id);G.sel=G.sel.filter(x=>x!=id);save()}}
draw();if(['new','menu','back','cont','loadv','savev','start','ld','next','tab'].includes(a))window.scrollTo(0,0)});
draw();
</script>
